@for (thickness of thicknesses; track thickness) {
<div
  class="tsp-line-thickness-picker__option"
  [class.tsp-line-thickness-picker__option--selected]="thickness === selectedThickness"
  (click)="selectThickness(thickness)"
>
  <div class="tsp-line-thickness-picker__bar" [style.--thickness.px]="thickness"></div>
</div>
}
