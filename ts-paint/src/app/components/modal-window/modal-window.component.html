<div
  class="tsp-modal-window__container tsp-raised-item-container"
  [ngClass]="{ 'tsp-modal-window__container--fullscreen': fullscreen }"
  >
  <div class="tsp-modal-window__inner-container tsp-raised-item">
    <div class="tsp-modal-window__title-bar tsp-horizontal-bar">
      @if (this.icon) {
        <div class="tsp-modal-window__title-bar-icon" [ngClass]="iconClass"></div>
      }
      <div class="tsp-can-grow">
        {{ title }}
      </div>
      @if (closable) {
        <button class="tsp-button tsp-modal-window__close-button" (click)="closeClicked.emit()"></button>
      }
    </div>
    <ng-content></ng-content>
  </div>
</div>
