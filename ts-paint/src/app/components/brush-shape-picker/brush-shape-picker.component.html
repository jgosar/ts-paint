<div class="tsp-brush-shape-picker">
  @for (shape of shapes; track shape.form + '-' + shape.size) {
  <div
    class="tsp-brush-shape-picker__option"
    [class.tsp-brush-shape-picker__option--selected]="$index === selectedIndex"
    [style.--size.px]="shape.size"
    (click)="selectShape(shape)"
  >
    <div class="tsp-brush-shape-picker__highlight"></div>
    <canvas #brushCanvas class="tsp-brush-shape-picker__brush" [width]="shape.size" [height]="shape.size"></canvas>
  </div>
  }
</div>
