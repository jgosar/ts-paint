<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig used for the e2e tests (FONTCONFIG_FILE in scripts/e2e-docker.sh and .github/workflows/test.yml).
  The app's font is a pixel font that lands exactly on the pixel grid at 8px, but the Linux defaults render it with
  subpixel (LCD) anti-aliasing, which smears every glyph into colored fringes. Monochrome rendering gives the bitmap
  text of the original Windows 95 Paint and makes the screenshots pixel-exact.
  The visual tests run at device scale 2 (playwright.config.ts): Chromium positions centred text on half CSS pixels,
  which this rendering would turn into dropped strokes at scale 1, but which is a whole device pixel at scale 2.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
