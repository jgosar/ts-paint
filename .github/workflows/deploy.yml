name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-paint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ts-paint/.nvmrc
          cache: npm
          cache-dependency-path: ts-paint/package-lock.json
      - run: npm ci
      - run: npx ng build --base-href=/ts-paint/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ts-paint/dist/ts-paint/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
